name: Authentication, identity, and profile CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  foundation:
    name: Authentication, identity, and profile checks
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '24'
      DATABASE_URL: postgresql://foundation:foundation@localhost:5432/foundation?schema=public
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: foundation
          POSTGRES_PASSWORD: foundation
          POSTGRES_DB: foundation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foundation -d foundation"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Apply migrations to clean PostgreSQL
        run: npm run db:deploy

      - name: Build workspace
        run: npm run build
