services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-skill-exchange-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus_skill_exchange}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-campus_skill_exchange}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - campus-skill-exchange-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campus-skill-exchange-postgres-data:
